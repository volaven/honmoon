name: Windows release
on:
  push:
    tags: ['v*', '!v*-media-preview-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw 'Tag must match package.json version.' }
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: node scripts/package-check.mjs
      - run: ./scripts/release.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: honmoon-windows
          path: |
            release/*.zip
            release/honmoon-release.json
            release/install.ps1
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @((Get-ChildItem release/*.zip).FullName) + @('release/honmoon-release.json', 'release/install.ps1')
          gh release create $env:GITHUB_REF_NAME @assets --draft --generate-notes
        shell: pwsh
